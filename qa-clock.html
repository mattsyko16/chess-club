ite wins&lt;/button&gt;&lt;button data-finish=&quot;draw&quot; data-busy&gt;Draw&lt;/button&gt;&lt;button data-finish=&quot;black&quot; data-busy&gt;Black wins&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;fine&quot;&gt;The clock runs on this device. Keep the page open and device unlocked. Screen wake lock is used where supported. Match results sync across devices.&lt;/p&gt;&lt;/section&gt;

 const pass=$('pass').value;
